name: Release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to retry (leave empty to run release-please)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  ci:
    if: ${{ !inputs.tag }}
    uses: ./.github/workflows/ci.yml

  release-please:
    needs: ci
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      !inputs.tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: ${{ github.event.repository.default_branch }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: >-
      always() && !cancelled() &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (needs.release-please.outputs.release_created == 'true' || inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - name: Verify draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable release tag such as v0.1.0" >&2
            exit 1
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" != true ]]; then
            echo "Only an existing draft release can be published by this workflow" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "The release tag must belong to the default branch history" >&2
            exit 1
          fi
          if [[ "v$(jq -r '.["."]' .release-please-manifest.json)" != "$RELEASE_TAG" ]]; then
            echo "The release tag does not match its version manifest" >&2
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Validate tagged source and build archives
        run: |
          make check
          make release VERSION="$RELEASE_TAG"
      - name: Verify checksums and Linux build identity
        run: |
          (cd dist && shasum -a 256 -c SHA256SUMS)
          mkdir "$RUNNER_TEMP/cadi-smoke"
          tar -xzf "dist/cadi_${RELEASE_TAG}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/cadi-smoke"
          test "$("$RUNNER_TEMP/cadi-smoke/cadi" version)" = "cadi $RELEASE_TAG"
      - name: Upload assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
